name: Generate Sitemap

on:
  push:
    branches:
      - main
    paths-ignore:
      - sitemap.xml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate sitemap.xml
        run: |
          python3 << 'EOF'
          from pathlib import Path
          from xml.sax.saxutils import escape

          BASE_URL = "https://yamasho-me.github.io"

          urls = []

          for path in Path(".").rglob("*.html"):

              # .github などを除外
              if any(part.startswith(".") for part in path.parts):
                  continue

              # Google Search Console確認ファイルを除外
              if path.name.startswith("google"):
                  continue

              path_str = path.as_posix()

              if path_str == "index.html":
                  url = BASE_URL + "/"

              elif path.name == "index.html":
                  url = BASE_URL + "/" + path.parent.as_posix() + "/"

              else:
                  url = BASE_URL + "/" + path_str

              urls.append(url)

          urls = sorted(set(urls))

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          ]

          for url in urls:
              lines.extend([
                  "  <url>",
                  f"    <loc>{escape(url)}</loc>",
                  "  </url>"
              ])

          lines.append("</urlset>")

          Path("sitemap.xml").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print(f"Generated sitemap with {len(urls)} URLs")
          EOF

      - name: Commit sitemap.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "No sitemap changes."
          else
            git commit -m "Auto-update sitemap"
            git push
          fi
